<!doctype html><meta charset="utf-8"><title>ScanSim Quick MVP</title>
<style>body{font:14px system-ui;margin:0;color:#223}main{display:grid;grid-template-columns:240px 1fr 260px;gap:12px;padding:12px}section{border:1px solid #ccd6df;border-radius:8px;padding:10px}label{display:block;margin:6px 0}input{width:100%;box-sizing:border-box}button{margin:4px 2px;padding:6px 10px}img{max-width:100%;image-rendering:auto}canvas{width:100%;height:100px;border:1px solid #ccd6df}.muted{color:#687786;font-size:12px;white-space:pre-wrap}</style>
<main><section><h2>Quick 参数</h2><label>光斑 FWHM (m)<input id="spot" type="number" step="0.0001" value="0.0008"></label><label>光源强度<input id="laser" type="number" step="0.1" value="1"></label><label>PMT 增益<input id="gain" type="number" step="0.1" value="1"></label><label>前端 tau (s)<input id="tau" type="number" step="0.00001" value="0.00002"></label><label>积分筒缺陷<input id="defect" type="number" step="0.1" value="0"></label><label>背景<input id="background" type="number" step="0.01" value="0.02"></label><label>演示噪声 (V)<input id="noise" type="number" step="0.001" value="0"></label><label>送片速度 (m/s)<input id="feed" type="number" step="0.01" value="0.08"></label><button id="calc">计算 Quick Run</button><button id="play">播放</button><button id="pause">暂停</button><p id="status" class="muted">尚未计算</p></section><section><h2>扫描预览</h2><img id="preview"><canvas id="wave"></canvas><label>行 <input id="row" type="range" min="0" max="255" value="128"></label><p id="readout" class="muted"></p></section><section><h2>运行信息</h2><pre id="meta" class="muted"></pre><a id="download" download="selected_line.csv">导出当前行 CSV</a></section></main>
<script>
const $=id=>document.getElementById(id), cfg=()=>({spot_fwhm_m:+$('spot').value,laser_rel:+$('laser').value,pmt_gain_rel:+$('gain').value,tau_s:+$('tau').value,defect_amplitude:+$('defect').value,background_rel:+$('background').value,noise_sigma_v:+$('noise').value,feed_speed_m_s:+$('feed').value,width:512,height:256,case:'quick_ui'});
let current=null,playing=false,timer=null;
async function calculate(){ $('status').textContent='计算中…'; const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg())}); const b=await r.json(); if(!r.ok)throw Error(b.error); current=b; render(); $('status').textContent='完成：SIMULATED / APPROXIMATE'; }
function render(){const m=current.metadata,run=current.run;$('preview').src='/'+run+'/preview.png?'+Date.now();$('meta').textContent=JSON.stringify(m,null,2);$('download').href='/'+run+'/selected_line.csv';$('row').max=m.shape[0]-1;draw();}
async function draw(){if(!current)return; const r=current.run; const row=+$('row').value; const text=await fetch('/'+r+'/selected_line.csv').then(x=>x.text()); const lines=text.trim().split('\n').slice(1).map(x=>x.split(',')); const vals=lines.map(x=>+x[6]); const c=$('wave'),g=c.getContext('2d');c.width=600;c.height=120;g.clearRect(0,0,c.width,c.height);g.beginPath();vals.forEach((v,i)=>{const x=i/(vals.length-1)*c.width,y=c.height-(v/2.5)*c.height;i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle='#c05830';g.stroke();$('readout').textContent=`行 ${row} · 代表样本 ${vals.length} · V[0]=${vals[0]?.toFixed(4)}`;}
function start(){if(timer)return;playing=true;timer=setInterval(()=>{if(!playing)return;let r=$('row');r.value=(+r.value+1)%(+r.max+1);draw()},80)}
$('calc').onclick=()=>calculate().catch(e=>$('status').textContent='失败：'+e);$('row').oninput=draw;$('play').onclick=start;$('pause').onclick=()=>{playing=false;clearInterval(timer);timer=null};
</script>
