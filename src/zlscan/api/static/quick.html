<!doctype html>
<meta charset="utf-8">
<title>ScanSim Quick MVP · 逐行过程</title>
<style>
body{font:14px system-ui;margin:0;color:#223;background:#f7f9fb}main{display:grid;grid-template-columns:250px minmax(480px,1fr) 310px;gap:12px;padding:12px}section{border:1px solid #ccd6df;border-radius:8px;padding:10px;background:white}label{display:block;margin:6px 0}input{width:100%;box-sizing:border-box}button{margin:4px 2px;padding:6px 10px}img{max-width:100%;display:block}.muted{color:#687786;font-size:12px;white-space:pre-wrap}.warn{color:#a04422;font-weight:600}.chain{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.chain button{font-size:11px}.progress{position:relative;background:repeating-linear-gradient(45deg,#edf1f4,#edf1f4 8px,#f8fafb 8px,#f8fafb 16px);min-height:180px;overflow:hidden}.progress img{width:100%;clip-path:inset(0 0 100% 0)}canvas{width:100%;height:90px;border:1px solid #ccd6df;cursor:crosshair;margin:4px 0}.curve-label{font-size:11px;color:#687786}
</style>
<main>
<section><h2>Quick 参数</h2>
<label>光斑 FWHM (m)<input id="spot" type="number" step="0.0001" value="0.0008"></label>
<label>光源强度<input id="laser" type="number" step="0.1" value="1"></label>
<label>PMT 增益<input id="gain" type="number" step="0.1" value="1"></label>
<label>前端 tau (s)<input id="tau" type="number" step="0.00001" value="0.00002"></label>
<label>积分筒缺陷<input id="defect" type="number" step="0.1" value="0"></label>
<label>背景<input id="background" type="number" step="0.01" value="0.02"></label>
<label>演示噪声 (V)<input id="noise" type="number" step="0.001" value="0"></label>
<label>送片速度 (m/s)<input id="feed" type="number" step="0.01" value="0.08"></label>
<label>用户图像 (PNG/TIFF)<input id="input" type="file" accept=".png,.tif,.tiff,image/png,image/tiff"></label>
<button id="calc">计算并缓存</button><button id="prev">上一行</button><button id="next">下一行</button>
<button id="play">播放</button><button id="pause">暂停</button><button id="replay">重播</button>
<p id="status" class="muted">尚未计算</p>
<h3>讲解顺序</h3><div class="chain" id="chain"></div><p id="moduleText" class="muted">点击模块查看本行对应节点。模块顺序用于讲解，不表示现实系统整行串行执行。</p>
</section>
<section><h2>逐行扫描过程</h2><div class="progress"><img id="preview"><div id="future" class="muted">计算后按行展开；未回放区域保持遮罩</div></div>
<label>回放行 <input id="row" type="range" min="0" max="255" value="0"></label>
<label>行内样本游标 <input id="sample" type="range" min="0" max="511" value="0"></label>
<p id="rowReadout" class="muted"></p><p id="warning" class="warn"></p>
<div class="curve-label">power_rel（相对量）</div><canvas id="power" data-series="power_rel"></canvas>
<div class="curve-label">current_rel（相对量）</div><canvas id="current" data-series="current_rel"></canvas>
<div class="curve-label">voltage_v（V）</div><canvas id="voltage" data-series="voltage_v"></canvas>
<div class="curve-label">ADC code</div><canvas id="code" data-series="code"></canvas>
<div class="curve-label">density_hat（近似密度）</div><canvas id="density" data-series="density_hat"></canvas>
</section>
<section><h2>本行与节点</h2><pre id="rowMeta" class="muted"></pre><pre id="nodes" class="muted">尚未计算</pre><a id="download" download>导出选中行 CSV</a><br><a id="runjson" target="_blank">导出配置 / 运行 JSON</a><h3>当前运行</h3><pre id="meta" class="muted"></pre></section>
</main>
<script>
const $=id=>document.getElementById(id);
const series=['power_rel','current_rel','voltage_v','code','density_hat'];
const moduleLabels={mirror:'旋转多面镜 / f-θ',film:'底片密度 → 透射率',collection:'积分筒 / 收光耦合',pmt:'PMT 等效电流',afe:'log 前端 / tau',adc:'代表网格 ADC / 名义逆变换'};
let current=null,rowData=null,rowNumber=0,sampleNumber=0,playing=false,timer=null,requestSeq=0;
function cfg(){return {spot_fwhm_m:+$('spot').value,laser_rel:+$('laser').value,pmt_gain_rel:+$('gain').value,tau_s:+$('tau').value,defect_amplitude:+$('defect').value,background_rel:+$('background').value,noise_sigma_v:+$('noise').value,feed_speed_m_s:+$('feed').value,width:512,height:256,case:'quick_process'};}
function stop(){playing=false;if(timer){clearTimeout(timer);timer=null;}}
async function calculate(){stop();const seq=++requestSeq;$('status').textContent='计算中…';rowData=null;current=null;const body=cfg(),file=$('input').files[0];if(file){body.input_name=file.name;body.input_data=(await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=fail;r.readAsDataURL(file)}));}const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const b=await response.json();if(seq!==requestSeq)return;if(!response.ok)throw Error(b.error);current=b;rowNumber=0;sampleNumber=0;renderRun();await loadRow(0,seq);$('status').textContent='完成：SIMULATED / APPROXIMATE · 已缓存，可开始回放';}
function renderRun(){const m=current.metadata,run=current.run;$('preview').src='/'+run+'/preview.png?'+Date.now();$('row').max=m.shape[0]-1;$('row').value=0;$('runjson').href='/'+run+'/quick_run.json';$('meta').textContent=JSON.stringify({run,shape:m.shape,origin:m.origin,fidelity:m.fidelity,validation_status:m.validation_status,reconstruction_input:m.reconstruction_input,dynamic_state:m.dynamic_state,representative_time_step_s:m.representative_time_step_s,hardware_adc_clock_s:m.hardware_adc_clock_s},null,2);$('chain').innerHTML=Object.entries(moduleLabels).map(([key,label])=>`<button data-module="${key}">${label}</button>`).join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{$('moduleText').textContent=moduleLabels[b.dataset.module]+'：查看当前行缓存节点，不表示现实系统整行串行执行。';});}
async function loadRow(row,seq=requestSeq){if(!current)return;const run=current.run;const response=await fetch(`/api/row?run=${encodeURIComponent(run)}&row=${row}`);const b=await response.json();if(seq!==requestSeq||!current||current.run!==run)return;if(!response.ok)throw Error(b.error);rowNumber=b.row;rowData=b;$('row').value=rowNumber;$('sample').max=Math.max(0,b.sample_count-1);sampleNumber=Math.min(sampleNumber,b.sample_count-1);$('sample').value=sampleNumber;$('download').href=`/api/row.csv?run=${encodeURIComponent(run)}&row=${rowNumber}`;drawAll();}
function drawAll(){if(!rowData)return;const v=rowData.values;const n=rowData.sample_count;for(const id of series){const canvas=$(id==='power_rel'?'power':id==='current_rel'?'current':id==='voltage_v'?'voltage':id==='code'?'code':'density');drawCurve(canvas,v[id]||[],id);}const pct=(rowNumber+1)/(+$('row').max+1)*100;$('preview').style.clipPath=`inset(0 0 ${100-pct}% 0)`;$('future').textContent=`已展开到第 ${rowNumber} 行 / ${+$('row').max+1} 行；代表样本 ${n} 个`;$('warning').textContent=rowData.outside_scene?'警告：本行存在 outside_scene，查图位置已按旧模型钳到片边；不表示无限新内容。':'';const t=v.time_s||[],x=v.x_m||[],y=v.y_m||[];$('rowReadout').textContent=`行 ${rowNumber} · 样本 ${n} · valid=${(v.valid||[]).filter(Boolean).length} · saturated=${(v.saturated||[]).filter(Boolean).length} · t=${fmt(t[0])}…${fmt(t[n-1])} s · x=${fmt(x[0])}…${fmt(x[n-1])} m · y=${fmt(y[0])}…${fmt(y[n-1])} m`;$('nodes').textContent=nodeText();}
function drawCurve(canvas,values,key){const c=canvas.getContext('2d');c.width=700;c.height=90;c.clearRect(0,0,c.width,c.height);const finite=values.filter(v=>v!==null&&Number.isFinite(v));if(!finite.length)return;let lo=Math.min(...finite),hi=Math.max(...finite);if(lo===hi){lo-=1;hi+=1;}c.beginPath();values.forEach((value,i)=>{if(value===null)return;const x=i/Math.max(values.length-1,1)*c.width,y=c.height-(value-lo)/(hi-lo)*c.height;i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=key==='density_hat'?'#6d4bc2':key==='code'?'#557a9d':'#c05830';c.stroke();const x=sampleNumber/Math.max(values.length-1,1)*c.width;c.strokeStyle='#222';c.setLineDash([3,3]);c.beginPath();c.moveTo(x,0);c.lineTo(x,c.height);c.stroke();c.setLineDash([]);}
function fmt(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'NaN':Number(v).toPrecision(6)}
function nodeText(){if(!rowData)return'尚未计算';const v=rowData.values,i=sampleNumber;return `选中行 ${rowNumber} · 样本 ${i}\n位置 x=${fmt(v.x_m?.[i])} m, y=${fmt(v.y_m?.[i])} m, t=${fmt(v.time_s?.[i])} s\n光斑/透射率 teff_scan=${fmt(v.teff_scan?.[i])}\n积分筒 collection_profile=${fmt(v.collection_profile?.[i])}\n功率=${fmt(v.power_rel?.[i])} rel\nPMT电流=${fmt(v.current_rel?.[i])} rel\n目标电压=${fmt(v.target_voltage_v?.[i])} V\n无噪声滤波=${fmt(v.voltage_noiseless_v?.[i])} V\nADC code=${fmt(v.code?.[i])} · 重建输入=${fmt(v.reconstruction_voltage_v?.[i])} V\n近似密度=${fmt(v.density_hat?.[i])} · valid=${v.valid?.[i]}\n动态=${rowData.dynamic_state} · reconstruction_input=${rowData.reconstruction_input}`;}
function setSampleFromEvent(event){if(!rowData)return;const rect=event.currentTarget.getBoundingClientRect();sampleNumber=Math.max(0,Math.min(rowData.sample_count-1,Math.round((event.clientX-rect.left)/rect.width*(rowData.sample_count-1))));$('sample').value=sampleNumber;drawAll();}
async function step(delta){stop();if(!current)return;const next=Math.max(0,Math.min(+$('row').max,rowNumber+delta));await loadRow(next);}
function schedule(){if(!playing||!current)return;if(rowNumber>=+$('row').max){stop();$('status').textContent='回放完成：已在最后一行暂停';return;}loadRow(rowNumber+1).then(()=>{if(playing)timer=setTimeout(schedule,80)}).catch(e=>{stop();$('status').textContent='回放失败：'+e;});}
function start(){if(!current||playing)return;playing=true;$('status').textContent='回放中…';schedule();}
$('calc').onclick=()=>calculate().catch(e=>{$('status').textContent='失败：'+e});$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=start;$('pause').onclick=()=>{stop();$('status').textContent='已暂停'};$('replay').onclick=async()=>{stop();if(current){sampleNumber=0;await loadRow(0);start();}};$('row').oninput=()=>step(+$('row').value-rowNumber);$('sample').oninput=()=>{sampleNumber=+$('sample').value;drawAll();};document.querySelectorAll('canvas[data-series]').forEach(c=>c.onclick=setSampleFromEvent);
</script>
