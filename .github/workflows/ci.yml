{
  "name": "Cross-platform tests and wheel",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "src/**",
        "tests/**",
        "tools/**",
        "pyproject.toml",
        "README.md",
        "install/locks/ci-build.json",
        ".github/workflows/ci.yml"
      ]
    },
    "pull_request": {
      "paths": [
        "src/**",
        "tests/**",
        "tools/**",
        "pyproject.toml",
        "README.md",
        "install/locks/ci-build.json",
        ".github/workflows/ci.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "${{ matrix.os }} / Python ${{ matrix.python }}",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "windows-latest",
            "macos-latest"
          ],
          "python": [
            "3.11",
            "3.14"
          ]
        }
      },
      "env": {
        "PYTHONUTF8": "1",
        "PYTHONIOENCODING": "utf-8",
        "MPLBACKEND": "Agg",
        "PIP_DISABLE_PIP_VERSION_CHECK": "1"
      },
      "steps": [
        {
          "name": "Preserve frozen source bytes on the ephemeral runner",
          "shell": "bash",
          "run": "git config --global core.autocrlf false\ngit config --global core.longpaths true"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "${{ matrix.python }}",
            "cache": "pip",
            "cache-dependency-path": "pyproject.toml"
          }
        },
        {
          "name": "Install RTL simulator and Poppler on Linux",
          "if": "runner.os == 'Linux'",
          "shell": "bash",
          "run": "sudo apt-get update\nsudo apt-get install -y iverilog poppler-utils"
        },
        {
          "name": "Install Poppler on macOS",
          "if": "runner.os == 'macOS'",
          "shell": "bash",
          "run": "brew install poppler"
        },
        {
          "name": "Install and select Poppler on Windows",
          "if": "runner.os == 'Windows'",
          "shell": "pwsh",
          "run": "choco install poppler -y --no-progress\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$tool = Get-ChildItem 'C:\\ProgramData\\chocolatey\\lib\\poppler' -Recurse -Filter pdftotext.exe | Select-Object -First 1\nif (-not $tool) { throw 'Poppler pdftotext.exe not found' }\n$tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
        },
        {
          "name": "Run tests and isolated wheel audit",
          "shell": "bash",
          "run": "python -m tools.ci_runner --out \"$RUNNER_TEMP/scansim-ci-results\" --work \"$RUNNER_TEMP/scansim-ci-work\""
        },
        {
          "name": "Upload actual logs and installed-wheel evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "scansim-${{ matrix.os }}-py${{ matrix.python }}-attempt${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/scansim-ci-results",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
