[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlscan"
version = "0.0.0"
description = "Laser film-scanner simulation: optics to ADC to FPGA capture to reconstruction, with a timeline workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "h5py>=3.10",
    "tifffile>=2024.1.30",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
]
# Needed only to run the frozen legacy package A (its run_demo.py plots with matplotlib).
legacy = [
    "matplotlib>=3.8",
]

[project.scripts]
zlscan = "zlscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zlscan.evidence" = ["*.json"]
"zlscan.hardware" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than about ten seconds",
    "legacy: regression against the frozen legacy packages (slow, runs their code in subprocesses)",
    "perf: performance measurement, not run by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# legacy/ is frozen third-party-style code and must not be reformatted or linted.
# docs/ holds specification pseudo-code in Markdown fences; ruff must not rewrite it.
extend-exclude = ["legacy", "evidence_runs", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One data row per parameter, with CJK text that ruff counts as double width; wrapping the rows
# would make the table harder to read, so the line-length rule is relaxed for this file only.
"tools/build_parameter_table.py" = ["E501"]
# Embeds the source text of programs that run inside the legacy packages' subprocesses.
"tools/legacy_experiments.py" = ["E501"]
# Builds a long Markdown report from f-strings, one table row per line.
"tools/trace_store_benchmark.py" = ["E501"]
"src/zlscan/experiment/faults.py" = ["E501"]  # detectability table text
"src/zlscan/config/presets.py" = ["E501"]  # config field mapping tables
"src/zlscan/report/digital_view.py" = ["E501"]  # embedded page script
# Holds the page's CSS, script and HTML as text.
"src/zlscan/report/viewer.py" = ["E501"]
# One relation per line, so the table of constraints can be read as a table.
"src/zlscan/budget/geometry.py" = ["E501"]
